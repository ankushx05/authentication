syntax = "proto3";

package admin.mail_template.v1;

import "buf/validate/validate.proto";

// ========================= EMAIL TEMPLATE ENUM =========================
enum EmailTemplate {
  EMAIL_TEMPLATE_UNSPECIFIED = 0;
  EMAIL_TEMPLATE_ADMIN_LOGIN = 1;
  EMAIL_TEMPLATE_USER_LOGIN = 2;
  EMAIL_TEMPLATE_USER_REGISTER = 3;
  EMAIL_TEMPLATE_USER_FORGOT_PASSWORD = 4;
}

// ========================= SERVICE =========================
service MailTemplateService {
  rpc CreateMailTemplate(CreateMailTemplateRequest) returns (CreateMailTemplateResponse);
  rpc UpdateMailTemplate(UpdateMailTemplateRequest) returns (UpdateMailTemplateResponse);
  rpc DeleteMailTemplate(DeleteMailTemplateRequest) returns (DeleteMailTemplateResponse);
  rpc GetMailTemplate(GetMailTemplateRequest) returns (GetMailTemplateResponse);
  rpc ListMailTemplates(ListMailTemplatesRequest) returns (ListMailTemplatesResponse);
}

// ========================= MAIL TEMPLATE MESSAGE =========================
message MailTemplate {
  string id = 1;
  string name = 2;
  string subject = 3;
  string body = 4;
  repeated string variables = 5;
  EmailTemplate unique_key = 6;
  string created_at = 7;
  string updated_at = 8;
}

// ========================= CREATE =========================
message CreateMailTemplateRequest {
  string name = 1 [(buf.validate.field).string.min_len = 1];
  string subject = 2 [(buf.validate.field).string.min_len = 1];
  string body = 3 [(buf.validate.field).string.min_len = 1];
  repeated string variables = 4;
  EmailTemplate unique_key = 5 [(buf.validate.field).enum = {not_in: [0]}];
}

message CreateMailTemplateResponse {
  string message = 1;
  MailTemplate mail_template = 2;
}

// ========================= UPDATE =========================
message UpdateMailTemplateRequest {
  string id = 1 [(buf.validate.field).string.uuid = true];
  string name = 2 [(buf.validate.field).string.min_len = 1];
  string subject = 3 [(buf.validate.field).string.min_len = 1];
  string body = 4 [(buf.validate.field).string.min_len = 1];
  repeated string variables = 5;
  EmailTemplate unique_key = 6 [(buf.validate.field).enum = {not_in: [0]}];
}

message UpdateMailTemplateResponse {
  string message = 1;
  MailTemplate mail_template = 2;
}

// ========================= DELETE =========================
message DeleteMailTemplateRequest {
  string id = 1 [(buf.validate.field).string.uuid = true];
}

message DeleteMailTemplateResponse {
  string message = 1;
}

// ========================= GET =========================
message GetMailTemplateRequest {
  string id = 1 [(buf.validate.field).string.uuid = true];
}

message GetMailTemplateResponse {
  MailTemplate mail_template = 1;
}

// ========================= LIST =========================
message ListMailTemplatesRequest {}

message ListMailTemplatesResponse {
  repeated MailTemplate mail_templates = 1;
}
